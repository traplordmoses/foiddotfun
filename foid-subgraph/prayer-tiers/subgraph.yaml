specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PrayerTiers
    network: fluent
    source:
      address: "0x5Cf1bf680FFF2ecB146eF977bF46C4CAE46bA4c6"
      abi: PrayerTiers
      startBlock: 2150347
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TierUp
        - UserTier
      abis:
        - name: PrayerTiers
          file: ./abis/PrayerTiers.json
      eventHandlers:
        - event: TierUp(indexed address,uint8,string)
          handler: handleTierUp
      file: ./src/mapping.ts
  - kind: ethereum
    name: PrayerRegistry
    network: fluent
    source:
      address: "0xf98Ec3dd6BfFBf79528918dc6fD153ca2ba8d3Da"
      abi: PrayerRegistry
      startBlock: 2150262
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PrayerSubmitted
      abis:
        - name: PrayerRegistry
          file: ./abis/PrayerRegistry.json
      eventHandlers:
        - event: PrayerSubmitted(indexed address,bytes32,uint256)
          handler: handlePrayerSubmitted
      file: ./src/mapping.ts

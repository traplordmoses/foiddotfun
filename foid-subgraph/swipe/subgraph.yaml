specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Swipe
    network: fluent-testnet
    source:
      address: "0xddc2623Bd80B1429426e30Be3D02e52ff6f90C44"
      abi: Swipe
      startBlock: 21984763
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposed
        - LoreboardProposed
        - Finalized
        - PlacementClaimed
        - VoucherIssued
      abis:
        - name: Swipe
          file: ./abis/Swipe.json
      eventHandlers:
        - event: Proposed(indexed uint256,indexed address,string,uint256)
          handler: handleProposed
        - event: LoreboardProposed(indexed uint256,indexed address,string,int32,int32,uint32,uint32,uint256)
          handler: handleLoreboardProposed
        - event: Finalized(indexed uint256,bool,uint256,uint256)
          handler: handleFinalized
        - event: VoucherIssued(indexed uint256,indexed address,uint64)
          handler: handleVoucherIssued
        - event: PlacementClaimed(indexed uint256,indexed address,int32,int32,uint32,uint32,string)
          handler: handlePlacementClaimed
      file: ./src/mapping.ts

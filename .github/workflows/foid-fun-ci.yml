# .github/workflows/foid-fun-ci.yml
# PR gate for the Next.js app in foid_fun/. Runs on every PR and every
# push to main. Any failure blocks the merge.
#
# Pipeline:
#   1. typecheck       — `pnpm typecheck`
#   2. lint            — `pnpm lint`
#   3. unit tests      — `pnpm test` (vitest, includes coverage thresholds
#                        configured in vitest.config.ts: hooks ≥85%, ui ≥75%)
#   4. a11y gate       — Playwright + axe-core against /board
#   5. visual regress  — Playwright toHaveScreenshot diff
#   6. lighthouse      — perf budget, mobile P≥90
#
# Chain-dependent specs (propose-*.spec.ts) are gated on ANVIL_FORK_URL
# and skipped in the default workflow — enable them in a follow-up PR
# once the Anvil container is wired into CI.

name: foid-fun CI

on:
  pull_request:
    paths:
      - "foid_fun/**"
      - ".github/workflows/foid-fun-ci.yml"
  push:
    branches: [main]

defaults:
  run:
    working-directory: foid_fun

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: foid_fun/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  unit-tests:
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: foid_fun/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: foid_fun/coverage

  e2e-a11y:
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: foid_fun/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Next.js
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Run a11y + visual specs
        run: pnpm test:e2e -- --project=chromium tests/e2e/board/a11y.spec.ts tests/e2e/board/visual.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: foid_fun/playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: foid_fun/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Start Next.js
        run: pnpm start &
        env:
          PORT: 3000
      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/board
            http://localhost:3000/pray
          # Assertions live in lighthouserc.json. Do NOT reintroduce
          # budgetPath: the action picks one or the other
          # (`if (budgetPath) --budgetsFile else --config`), so setting it
          # silently discarded every category assertion. Budgets were also
          # only passed at assert time, never at collect, so the LHRs had no
          # performance-budget audit for them to check — the job was green by
          # construction from 2026-09-04 until this commit. The old budget
          # thresholds now live in lighthouserc.json as warn-level assertions,
          # which do run.
          configPath: ./foid_fun/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

services:
  - type: web
    name: foid-fun
    runtime: node
    rootDir: foid_fun
    plan: free
    region: ohio
    branch: main
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
    startCommand: "pnpm run start"
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # All app env vars are set in the Render dashboard (not in yaml for security)
      # Use .env.render file to bulk-import them via Render dashboard

  - type: cron
    name: foid-finalize
    runtime: node
    rootDir: foid_fun
    schedule: "0 * * * *"
    buildCommand: "echo 'no build needed'"
    startCommand: "curl -sf -X POST -H \"x-cron-secret: ${CRON_SECRET}\" \"${FOID_APP_URL}/api/swipe/finalize\" || echo 'finalize skipped'"
    envVars:
      - key: FOID_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  # foid-x-bot cron archived — see foid_fun/foid_bot/ARCHIVED.md for revival steps.
  # The bot source still lives at foid_fun/foid_bot/ but is no longer scheduled.
